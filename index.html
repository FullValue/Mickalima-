<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta (dynamic per route via React Helmet) -->
  <title>Mickaël Lima — Agent Immobilier Prestige | Pays de Gex</title>
  <meta name="description" content="Agent immobilier prestige dans le Pays de Gex. Mickaël Lima vous accompagne pour vendre votre bien au meilleur prix : estimation gratuite, diffusion sur +40 portails, clientèle frontalière et internationale." />
  <meta name="robots" content="index, follow" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- LCP : preload hero image avec haute priorité -->
  <link rel="preload" as="image" href="/images/hero-main.jpg" fetchpriority="high" />

  <!--
    Schema.org JSON-LD : déplacé dans HomePage (AppContent.tsx) via React Helmet
    pour éviter la duplication sur les 41 pages pré-rendues. Les schemas globaux
    (RealEstateAgent + LocalBusiness, Person) sont désormais homepage-only.
    Les pages internes injectent leurs propres schemas contextuels (Article,
    BreadcrumbList, RealEstateAgent avec areaServed local, FAQPage).
  -->

  <!-- OG fallbacks statiques — remplacés dynamiquement par React Helmet sur chaque route -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mickaël Lima — Agent Immobilier" />
  <meta property="og:title" content="Mickaël Lima — Agent Immobilier Prestige | Pays de Gex" />
  <meta property="og:description" content="Agent immobilier prestige dans le Pays de Gex. Estimation gratuite, diffusion sur +40 portails, clientèle frontalière genevoise et internationale." />
  <meta property="og:url" content="https://mickael-lima.immo/" />
  <meta property="og:image" content="https://mickael-lima.immo/images/pool-cta-final.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="fr_FR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mickaël Lima — Agent Immobilier Prestige | Pays de Gex" />
  <meta name="twitter:description" content="Agent immobilier prestige dans le Pays de Gex. Estimation gratuite, diffusion sur +40 portails, clientèle frontalière genevoise et internationale." />
  <meta name="twitter:image" content="https://mickael-lima.immo/images/pool-cta-final.jpg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

  <style>
    html {
      scroll-behavior: smooth;
      background-color: #FFFFFF;
    }

    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      color: #003064;
      background-color: #FFFFFF;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
